name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (flow layer)
        run: node --test app/lib/flow.test.js

      - name: Smoke test (/api/flow, canned data)
        run: node scripts/smoke-flow.mjs

      - name: Build (type + compile gate)
        run: npm run build
